name: Build IPA

# Builds every native chain from a clean checkout (docs/BUILDING.md) and
# packages an UNSIGNED Madeira.ipa. No runtime stubs.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration (Debug is the one that runs games)
        default: Debug
        type: choice
        options: [Debug, Release]
      bundle_steam:
        description: Bundle the 64-bit Steam client (scripts/fetch-steam.sh) into the app
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ipa.yml"
      - "scripts/ci/**"
      - "scripts/fetch-steam.sh"
      - "build/**"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Compiler cache (see the ccache steps). BASEDIR keeps cached paths
  # relative so hits survive a different workspace path. The default
  # compiler check (mtime+size) re-keys everything when Xcode changes.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 3G
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  LLVM_VERSION: 15.0.7
  FREETYPE_TAG: VER-2-13-3
  CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
  # Bump when a native build step below changes in a way the hashed files
  # (see the "native" cache key) do not capture.
  NATIVE_CACHE_VERSION: v1

# contents: write lets the job create the release (the default token may be
# read-only).
permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ContentView.swift uses glassEffect (iOS 26 SDK), so Xcode 16 cannot
      # compile the app. Pick the newest Xcode 26+ on the image.
      - name: Select Xcode 26
        run: |
          set -eu
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] || { ls -d /Applications/Xcode*.app; echo "::error::No Xcode 26+ on this runner image"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      # Caching, fastest path first:
      #  - "native": the unix-side static libraries plus FEX (headers and
      #    libs the app compiles and links against). Keyed by the submodule
      #    commits and every file the native build reads, so a change that
      #    only touches the app or the bundled Windows binaries skips the
      #    submodules, the toolchains and all native builds.
      #  - On a native miss: submodule git objects, the configured Wine
      #    headers, FreeType, llvm-mingw, LLVM, GnuTLS and ccache each come
      #    from their own cache.
      #  - The Steam client is cached pre-zipped per Steam manifest.
      - name: Cache keys
        id: keys
        run: |
          set -eu
          SUBS=$(git ls-tree HEAD wine FEX research/dxmt | awk '{print substr($3,1,12)}' | paste -sd- -)
          XCODE=$(xcodebuild -version | head -1 | tr -cd '0-9.')
          echo "subs=$SUBS" >> "$GITHUB_OUTPUT"
          echo "xcode=$XCODE" >> "$GITHUB_OUTPUT"
          echo "wine=$(git ls-tree HEAD wine | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "subs=$SUBS xcode=$XCODE"

      - name: Restore native libraries
        id: native
        uses: actions/cache/restore@v4
        with:
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libdxmt_combined.a
            FEX
            !FEX/.git
            !FEX/**/.git
            !FEX/build-ios/**/*.o
          key: native-${{ env.NATIVE_CACHE_VERSION }}-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.subs }}-${{ hashFiles('build/**', '!build/steamservice/**', '!build/proc-tests/**', '!build/x64-tests/**', '!build/d3d11-triangle/**', '!build/dxmt-tests/**', '!build/host-tests/**', '!build/net-tests/**', '!build/wine-pe/**', '!build/fex-arm64ec/**', 'research/madeira-d3d12/**', 'scripts/ci/**') }}

      # The FEX gitfile can come back from the cache and points at a
      # .git/modules/FEX this checkout does not have.
      - name: Drop restored FEX gitfile
        if: steps.native.outputs.cache-hit == 'true'
        run: rm -rf FEX/.git

      # Everything from here to "Save native libraries" runs only on a miss.
      - name: Restore submodule objects
        if: steps.native.outputs.cache-hit != 'true'
        id: submodule-objects
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: submodules-v1-${{ steps.keys.outputs.subs }}

      # Submodules by hand so FEX's test-binary repos and Catch2 (unused with
      # BUILD_TESTING=OFF, and the bulk of the download) are skipped. With the
      # objects restored above this is a local checkout.
      - name: Submodules
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          git submodule update --init --depth 1 --jobs 3 wine research/dxmt FEX
          git -C wine submodule update --init --recursive --depth 1 --jobs 4
          git -C research/dxmt submodule update --init --recursive --depth 1 --jobs 4
          git -C FEX \
            -c submodule.External/fex-posixtest-bins.update=none \
            -c submodule.External/fex-gvisor-tests-bins.update=none \
            -c submodule.External/fex-gcc-target-tests-bins.update=none \
            -c submodule.External/Catch2.update=none \
            submodule update --init --recursive --depth 1 --jobs 4
          # Restored git dirs carry the previous run's index, so a checkout of
          # the same commit would leave the (empty) work trees as they are.
          git submodule foreach --recursive --quiet 'git reset --hard -q'
          git submodule status --recursive | grep -v '^-' | head -40

      - name: Save submodule objects
        if: steps.native.outputs.cache-hit != 'true' && steps.submodule-objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: submodules-v1-${{ steps.keys.outputs.subs }}

      # DXMT's airconv shaders need the Metal compiler, a separate download
      # since Xcode 26.
      - name: Metal toolchain
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          xcrun -sdk macosx metal --version 2>/dev/null \
            || sudo xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Restore llvm-mingw
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: llvm-mingw-20240619-ucrt-macos-universal

      - name: Host tools
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          # Only what the image lacks (a full `brew install` of the list
          # re-checks every formula). llvm-objcopy comes from llvm-mingw.
          missing=""
          for f in ninja meson bison flex ccache cmake pkg-config; do
            brew list --versions "$f" >/dev/null 2>&1 || missing="$missing $f"
          done
          [ -z "$missing" ] || brew install $missing
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"  >> "$GITHUB_PATH"

          # FEX Scripts/aarch64_fit_native.py needs packaging (or pkg_resources)
          # Homebrew Python is externally managed (PEP 668).
          python3 -m pip install --user --break-system-packages packaging setuptools

          LM="$HOME/llvm-mingw"
          if [ ! -x "$LM/bin/aarch64-w64-mingw32-clang" ]; then
            URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-macos-universal.tar.xz"
            curl -fL --retry 3 -o /tmp/llvm-mingw.tar.xz "$URL"
            rm -rf "$LM" && mkdir -p "$LM"
            tar -xJf /tmp/llvm-mingw.tar.xz -C "$LM" --strip-components=1
          fi
          test -x "$LM/bin/aarch64-w64-mingw32-clang"
          test -x "$LM/bin/llvm-objcopy"
          echo "$LM/bin" >> "$GITHUB_PATH"
          export PATH="$LM/bin:$PATH"
          aarch64-w64-mingw32-clang --version | head -1
          xcodebuild -version

      # One cache entry per run; each run starts from the newest earlier one.
      - name: Compiler cache
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Route xcrun clang through ccache
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          cp scripts/ci/xcrun-ccache "$RUNNER_TEMP/ccache-bin/xcrun"
          echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
          ccache --zero-stats
          ccache --show-config | grep -E "cache_dir|base_dir|max_size"

      - name: Restore LLVM (iOS) cache
        if: steps.native.outputs.cache-hit != 'true'
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
          key: llvm-ios-${{ env.LLVM_VERSION }}-v1

      - name: Build LLVM ${{ env.LLVM_VERSION }} for iOS
        if: steps.native.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p toolchains && cd toolchains
          git clone --depth 1 --branch llvmorg-$LLVM_VERSION --filter=blob:none --sparse \
              https://github.com/llvm/llvm-project.git llvm-project
          git -C llvm-project sparse-checkout set llvm cmake third-party
          sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' llvm-project/llvm/cmake/modules/AddLLVM.cmake
          COMMON=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=
                  -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF
                  -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF
                  -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBXML2=OFF
                  -DCMAKE_CXX_FLAGS=-Wno-enum-constexpr-conversion)
          cmake -S llvm-project/llvm -B llvm-host-build "${COMMON[@]}"
          ninja -C llvm-host-build llvm-tblgen
          cmake -S llvm-project/llvm -B llvm-ios-build "${COMMON[@]}" \
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
              -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
              -DLLVM_TARGET_ARCH=host -DLLVM_ENABLE_PROJECTS= \
              -DLLVM_BUILD_TOOLS=OFF -DLLVM_INCLUDE_TOOLS=OFF -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_UTILS=OFF \
              -DLLVM_TABLEGEN="$PWD/llvm-host-build/bin/llvm-tblgen"
          ninja -C llvm-ios-build
          ls llvm-ios-build/lib/*.a | wc -l

      - name: Save LLVM (iOS) cache
        if: steps.native.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
          key: llvm-ios-${{ env.LLVM_VERSION }}-v1

      - name: Restore GnuTLS cache
        if: steps.native.outputs.cache-hit != 'true'
        id: gnutls-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchains/gnutls-ios
          key: gnutls-ios-${{ hashFiles('build/gnutls-ios/build.sh', 'build/gnutls-ios/src/SHA256SUMS') }}

      - name: Build GnuTLS stack
        if: steps.native.outputs.cache-hit != 'true' && steps.gnutls-cache.outputs.cache-hit != 'true'
        run: bash build/gnutls-ios/build.sh

      - name: Save GnuTLS cache
        if: steps.native.outputs.cache-hit != 'true' && steps.gnutls-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/gnutls-ios
          key: gnutls-ios-${{ hashFiles('build/gnutls-ios/build.sh', 'build/gnutls-ios/src/SHA256SUMS') }}

      - name: Restore FreeType
        if: steps.native.outputs.cache-hit != 'true'
        id: freetype
        uses: actions/cache/restore@v4
        with:
          path: |
            research/freetype
            build/freetype-ios/build/libfreetype.a
            build/freetype-ios/build/include
          key: freetype-${{ env.FREETYPE_TAG }}-${{ steps.keys.outputs.xcode }}-${{ hashFiles('build/freetype-ios/build.sh') }}

      - name: Build FreeType
        if: steps.native.outputs.cache-hit != 'true' && steps.freetype.outputs.cache-hit != 'true'
        run: |
          set -eux
          rm -rf research/freetype
          git clone --depth 1 --branch "$FREETYPE_TAG" https://github.com/freetype/freetype.git research/freetype \
            || git clone --depth 1 https://github.com/freetype/freetype.git research/freetype
          test -d research/freetype
          bash build/freetype-ios/build.sh

      - name: Save FreeType
        if: steps.native.outputs.cache-hit != 'true' && steps.freetype.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            research/freetype
            build/freetype-ios/build/libfreetype.a
            build/freetype-ios/build/include
          key: freetype-${{ env.FREETYPE_TAG }}-${{ steps.keys.outputs.xcode }}-${{ hashFiles('build/freetype-ios/build.sh') }}

      - name: Restore Wine host headers
        if: steps.native.outputs.cache-hit != 'true'
        id: wine-cfg
        uses: actions/cache/restore@v4
        with:
          path: wine/build-macos
          key: wine-cfg-v1-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.wine }}-${{ hashFiles('scripts/ci/configure-wine.sh') }}

      - name: Configure Wine (host headers)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          export PATH="$HOME/llvm-mingw/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          if [ "${{ steps.wine-cfg.outputs.cache-hit }}" = "true" ]; then
            bash scripts/ci/configure-wine.sh --sources
          else
            bash scripts/ci/configure-wine.sh
          fi

      - name: Save Wine host headers
        if: steps.native.outputs.cache-hit != 'true' && steps.wine-cfg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wine/build-macos
          key: wine-cfg-v1-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.wine }}-${{ hashFiles('scripts/ci/configure-wine.sh') }}

      - name: Build FEXCore
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          # Ensure packaging is importable for FEX scripts
          python3 -c "import packaging; print(packaging.__version__)"
          python3 scripts/ci/patch-fex-ios.py
          bash build/fex-ios/build.sh || {
            # Keep going past the first failure so one run lists every error.
            cmake --build FEX/build-ios --target FEXCore FEXCore_Base JemallocLibs -- -k 0 2>&1 \
              | grep -E "error:|FAILED" | head -150
            exit 1
          }

      - name: Build libntdll_unix.a
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          export PATH="$HOME/llvm-mingw/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          # server_ios.c's [xp] line reads rusage_info_v6.ri_page_wait_time_mach,
          # which only newer SDKs than this runner's declare. If the SDK lacks
          # it, log 0 for that one diagnostic column instead.
          printf '#include <sys/resource.h>\nint f(struct rusage_info_v6 *r){return (int)r->ri_page_wait_time_mach;}\n' > "$RUNNER_TEMP/ru.c"
          if ! xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -c "$RUNNER_TEMP/ru.c" -o /dev/null 2>/dev/null; then
            echo "::warning::SDK lacks ri_page_wait_time_mach; [xp] pgw column logs 0"
            sed -i '' 's/XP_MS( ru.ri_page_wait_time_mach - pru.ri_page_wait_time_mach )/0.0/' build/ntdll-unix/server_ios.c
            ! grep -q ri_page_wait_time_mach build/ntdll-unix/server_ios.c
          fi
          bash build/ntdll-unix/build.sh
          test -s app/Madeira/libntdll_unix.a

      - name: Build libwineserver.a
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          export PATH="$HOME/llvm-mingw/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          python3 scripts/ci/patch-wine-ios.py
          bash scripts/ci/build-wineserver-base.sh
          bash build/wineserver/build.sh all
          test -s app/Madeira/libwineserver.a

      - name: Build libwin32u_unix.a
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          export PATH="$HOME/llvm-mingw/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          bash build/win32u-unix/build.sh
          test -s app/Madeira/libwin32u_unix.a

      - name: Build libdxmt_combined.a
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -eux
          bash build/dxmt-ios/build.sh
          xcrun -sdk iphoneos libtool -static -o build/dxmt-ios/libdxmt_combined.a \
              build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/
          test -s app/Madeira/libdxmt_combined.a

      - name: Save native libraries
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libdxmt_combined.a
            FEX
            !FEX/.git
            !FEX/**/.git
            !FEX/build-ios/**/*.o
          key: ${{ steps.native.outputs.cache-primary-key }}

      # Xcode 26 compilation caching: the CAS survives between runs, so
      # unchanged Swift/ObjC files are not recompiled even though a fresh
      # checkout gives every file a new mtime.
      - name: Restore Xcode compilation cache
        id: xc-cas
        uses: actions/cache/restore@v4
        with:
          path: app/xc-cas
          key: xc-cas-v1-${{ steps.keys.outputs.xcode }}-${{ env.CONFIGURATION }}-${{ github.run_id }}
          restore-keys: xc-cas-v1-${{ steps.keys.outputs.xcode }}-${{ env.CONFIGURATION }}-

      # Started in the background so the Steam steps below overlap it; "Wait
      # for Madeira.app" collects the result. If the build with compilation
      # caching fails, it is retried once without it.
      - name: Start Madeira.app build
        run: |
          set -eux
          bash build/stage-licenses.sh || true
          mkdir -p app/Madeira/x86_64-vcruntime
          cat > "$RUNNER_TEMP/xcbuild.sh" <<'SH'
          xcb() {
            xcodebuild -project app/Madeira.xcodeproj -target Madeira \
                -configuration "$CONFIGURATION" -sdk iphoneos \
                SYMROOT="$PWD/app/build" COMPILER_INDEX_STORE_ENABLE=NO \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
                "$@" build -showBuildTimingSummary > xcodebuild.log 2>&1
          }
          if xcb COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$PWD/app/xc-cas"; then
            echo 0 > "$RUNNER_TEMP/xcbuild.rc"
          else
            mv xcodebuild.log xcodebuild-cas.log
            rm -rf app/build
            xcb
            echo $? > "$RUNNER_TEMP/xcbuild.rc"
          fi
          SH
          rm -f "$RUNNER_TEMP/xcbuild.rc"
          nohup bash "$RUNNER_TEMP/xcbuild.sh" > /dev/null 2>&1 &

      # Pushes have no inputs, so an unset bundle_steam means "bundle".
      # The app copies Madeira.app/Steam into C:\Program Files (x86)\Steam
      # the first time "Steam Testing" is pressed (prepareSteamLaunch()).
      # Cached as a ready zip of Payload/Madeira.app/Steam per Steam manifest;
      # Package IPA adds the app to a copy of it. If the CDN is slow the
      # newest cached client is used.
      - name: Steam manifest
        if: format('{0}', inputs.bundle_steam) != 'false'
        id: steam
        run: |
          set -eu
          if curl -fsS --max-time 10 --retry 2 -o "$RUNNER_TEMP/steam_client_win64" \
               https://media.steampowered.com/client/steam_client_win64; then
            echo "hash=$(shasum -a 256 "$RUNNER_TEMP/steam_client_win64" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Steam manifest unavailable; using the newest cached client"
            echo "hash=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Steam client
        if: format('{0}', inputs.bundle_steam) != 'false'
        id: steam-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/steam-payload
          key: steam-v1-${{ steps.steam.outputs.hash }}-${{ hashFiles('scripts/fetch-steam.sh') }}
          restore-keys: steam-v1-

      - name: Fetch Steam client
        if: >-
          format('{0}', inputs.bundle_steam) != 'false' && steps.steam-cache.outputs.cache-hit != 'true'
          && !(steps.steam.outputs.hash == 'unknown' && steps.steam-cache.outputs.cache-matched-key != '')
        run: |
          set -eux
          P="$RUNNER_TEMP/steam-payload"
          rm -rf "$P" && mkdir -p "$P/Payload/Madeira.app"
          bash scripts/fetch-steam.sh "$P/Payload/Madeira.app/Steam"
          cp "$P/Payload/Madeira.app/Steam/package/steam_client_win64.manifest" "$P/"
          (cd "$P" && zip -qry -1 steam.zip Payload)
          rm -rf "$P/Payload"
          ls -lh "$P"

      - name: Save Steam client
        if: >-
          format('{0}', inputs.bundle_steam) != 'false' && steps.steam-cache.outputs.cache-hit != 'true'
          && steps.steam.outputs.hash != 'unknown'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/steam-payload
          key: steam-v1-${{ steps.steam.outputs.hash }}-${{ hashFiles('scripts/fetch-steam.sh') }}

      - name: Wait for Madeira.app
        id: app
        timeout-minutes: 30
        run: |
          set -eu
          while [ ! -f "$RUNNER_TEMP/xcbuild.rc" ]; do sleep 1; done
          rc=$(cat "$RUNNER_TEMP/xcbuild.rc")
          if [ -f xcodebuild-cas.log ]; then
            echo "::warning::build with compilation caching failed; rebuilt without it"
            grep -E "error:" -A3 xcodebuild-cas.log | head -40 || true
          fi
          if [ "$rc" != 0 ]; then
            grep -E "error:|Undefined symbols|referenced from" -A3 xcodebuild.log | head -300
            tail -50 xcodebuild.log
            exit 1
          fi
          sed -n '/Build Timing Summary/,$p' xcodebuild.log | head -25
          tail -3 xcodebuild.log
          if [ -d app/xc-cas ]; then echo "cas=1" >> "$GITHUB_OUTPUT"; du -sh app/xc-cas; fi

      - name: Save Xcode compilation cache
        if: steps.xc-cas.outputs.cache-hit != 'true' && steps.app.outputs.cas == '1'
        uses: actions/cache/save@v4
        with:
          path: app/xc-cas
          key: xc-cas-v1-${{ steps.keys.outputs.xcode }}-${{ env.CONFIGURATION }}-${{ github.run_id }}

      # The app is signed without Steam (an ad-hoc seal; sideloading re-signs
      # the whole bundle anyway), then zipped into a copy of the Steam zip so
      # only the app itself is compressed on each run.
      - name: Package IPA
        run: |
          set -eux
          APP="app/build/$CONFIGURATION-iphoneos/Madeira.app"
          IPA="$PWD/Madeira-$CONFIGURATION-unsigned.ipa"
          rm -rf "$APP/Steam" "$IPA"
          codesign --force --sign - --entitlements app/Madeira/Madeira.entitlements "$APP" || true
          STEAM_ZIP="$RUNNER_TEMP/steam-payload/steam.zip"
          [ ! -f "$STEAM_ZIP" ] || cp "$STEAM_ZIP" "$IPA"
          rm -rf ipa && mkdir -p ipa/Payload
          mv "$APP" ipa/Payload/
          (cd ipa && zip -qry -1 "$IPA" Payload)
          unzip -l "$IPA" | tail -1
          ls -lh "$IPA"

      # Every successful build becomes a release tagged build-<run number> on
      # the built commit. Only main builds are full releases (and "Latest");
      # builds of other branches are published as prereleases.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="build-${GITHUB_RUN_NUMBER}"
          STEAM_NOTE="no Steam"
          if [ -f "$RUNNER_TEMP/steam-payload/steam_client_win64.manifest" ]; then
            STEAM_NOTE="Steam client $(sed -n 's/^[[:space:]]*"version"[[:space:]]*"\([0-9]*\)".*/\1/p' \
              "$RUNNER_TEMP/steam-payload/steam_client_win64.manifest" | head -1)"
          fi
          PRERELEASE=""
          [ "$GITHUB_REF" = "refs/heads/main" ] || PRERELEASE="--prerelease"
          gh release create "$TAG" Madeira-*.ipa \
              --target "$GITHUB_SHA" \
              --title "Madeira $CONFIGURATION #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
              --notes "Unsigned $CONFIGURATION IPA from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}, ${STEAM_NOTE}. Sign it with your own Apple ID when sideloading. Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              $PRERELEASE

      # Keep the newest KEEP_RELEASES build-* releases and delete the rest
      # together with their tags. Releases with other tags (made by hand)
      # are never touched.
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RELEASES: 5
        run: |
          set -eu
          gh release list --limit 1000 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("build-"))]
                    | sort_by(.createdAt) | reverse
                    | .['"$KEEP_RELEASES"':][] | .tagName' |
          while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Compiler cache stats
        if: always() && steps.native.outputs.cache-hit != 'true'
        run: ccache --show-stats || true

      - name: Show compiler errors
        if: failure()
        run: |
          for f in build/*/obj/*.err build/*/obj/err-*.txt; do
            [ -s "$f" ] && { echo "::group::$f"; head -60 "$f"; echo "::endgroup::"; }
          done
          true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            xcodebuild-cas.log
            wine-configure.log
            build/*/obj/*.err
            build/*/obj/err-*.txt
            wine/build-macos/config.log
          if-no-files-found: ignore
