name: Build IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode configuration (Debug is what runs games)"
        required: false
        default: "Debug"
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read
  actions: read

jobs:
  build-ipa:
    name: Build host libs + unsigned IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers
          df -h .

      - name: Install build deps
        run: |
          set -euo pipefail
          brew install cmake ninja flex bison pkg-config python3 coreutils || true
          python3 -m pip install --break-system-packages --user packaging setuptools || true
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt host libs (GameHub CI artifacts)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prebuilt app/Madeira FEX/build-ios/FEXCore/Source
          mkdir -p FEX/build-ios/External/fmt FEX/build-ios/External/cephes
          mkdir -p FEX/build-ios/External/xxhash/cmake_unofficial FEX/build-ios/External/SoftFloat-3e

          # Public artifacts from ITZproVenom/GameHub-iOS (same Madeira fork lineage).
          # ntdll + wineserver + FEX set (~7MB) and DXMT (~36MB).
          download_artifact() {
            local owner=$1 repo=$2 run_id=$3 art_name=$4 dest=$5
            echo "Downloading $art_name from $owner/$repo run $run_id..."
            URL=$(gh api "repos/$owner/$repo/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name==\"$art_name\") | .archive_download_url" | head -1)
            if [ -z "$URL" ]; then echo "no artifact url"; return 1; fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$dest.zip" "$URL"
            unzip -o "$dest.zip" -d "$dest"
            ls -lh "$dest" || true
          }

          download_artifact ITZproVenom GameHub-iOS 34956261160 madeira-host-libs /tmp/prebuilt/core || true
          download_artifact ITZproVenom GameHub-iOS 36042687853 madeira-host-libs /tmp/prebuilt/dxmt || true

          # Place core libs
          for f in libntdll_unix.a libwineserver.a; do
            [ -f /tmp/prebuilt/core/$f ] && cp -v /tmp/prebuilt/core/$f app/Madeira/
          done
          [ -f /tmp/prebuilt/core/libFEXCore.a ] && cp -v /tmp/prebuilt/core/libFEXCore.a FEX/build-ios/FEXCore/Source/
          [ -f /tmp/prebuilt/core/fex/libFEXCore_Base.a ] && cp -v /tmp/prebuilt/core/fex/libFEXCore_Base.a FEX/build-ios/FEXCore/Source/
          [ -f /tmp/prebuilt/core/fex/libfmt.a ] && cp -v /tmp/prebuilt/core/fex/libfmt.a FEX/build-ios/External/fmt/
          [ -f /tmp/prebuilt/core/fex/libcephes_128bit.a ] && cp -v /tmp/prebuilt/core/fex/libcephes_128bit.a FEX/build-ios/External/cephes/
          [ -f /tmp/prebuilt/core/fex/libxxhash.a ] && cp -v /tmp/prebuilt/core/fex/libxxhash.a FEX/build-ios/External/xxhash/cmake_unofficial/
          [ -f /tmp/prebuilt/core/fex/libsoftfloat_3e.a ] && cp -v /tmp/prebuilt/core/fex/libsoftfloat_3e.a FEX/build-ios/External/SoftFloat-3e/

          # Jemalloc: often linked as empty/stub if FEX built without it — create thin archive of empty object
          if [ ! -f FEX/build-ios/FEXCore/Source/libJemallocLibs.a ]; then
            echo 'void madeira_jemalloc_stub(void){}' | xcrun -sdk iphoneos clang -arch arm64 -c -x c - -o /tmp/jemalloc_stub.o
            ar rcs FEX/build-ios/FEXCore/Source/libJemallocLibs.a /tmp/jemalloc_stub.o
            echo "created stub libJemallocLibs.a"
          fi

          # DXMT
          if [ -f /tmp/prebuilt/dxmt/libdxmt_combined.a ]; then
            cp -v /tmp/prebuilt/dxmt/libdxmt_combined.a app/Madeira/
          elif [ -f /tmp/prebuilt/dxmt/libdxmt_unix.a ]; then
            cp -v /tmp/prebuilt/dxmt/libdxmt_unix.a app/Madeira/libdxmt_combined.a
          fi

          echo "=== Prebuilt placement ==="
          find app/Madeira FEX/build-ios -name '*.a' -exec ls -lh {} \; 2>/dev/null || true

      - name: Build libwin32u_unix.a (if missing)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -uo pipefail
          if [ -s app/Madeira/libwin32u_unix.a ]; then
            ls -lh app/Madeira/libwin32u_unix.a
            exit 0
          fi
          if [ ! -d wine ]; then
            echo "wine submodule missing — cannot build win32u"
            exit 0
          fi
          # Minimal wine config.h for iOS compiles
          mkdir -p wine/build-macos/include
          if [ ! -f wine/build-macos/include/config.h ]; then
            {
              echo '#ifndef WINE_CONFIG_H'
              echo '#define WINE_CONFIG_H'
              echo '#define HAVE_SYS_TYPES_H 1'
              echo '#define HAVE_SYS_STAT_H 1'
              echo '#define HAVE_STDLIB_H 1'
              echo '#define HAVE_STRING_H 1'
              echo '#define HAVE_UNISTD_H 1'
              echo '#define HAVE_DLFCN_H 1'
              echo '#define HAVE_PTHREAD_H 1'
              echo '#define HAVE_SYS_MMAN_H 1'
              echo '#define HAVE_SYS_SOCKET_H 1'
              echo '#define HAVE_SYS_UN_H 1'
              echo '#define HAVE_POLL 1'
              echo '#define HAVE_MMAP 1'
              echo '#endif'
            } > wine/build-macos/include/config.h
          fi
          # Prefer project script; tolerate partial failure and still ar what we have
          set +e
          bash build/win32u-unix/build.sh 2>&1 | tee /tmp/win32u.log | tail -80
          set -e
          if [ -s app/Madeira/libwin32u_unix.a ]; then
            ls -lh app/Madeira/libwin32u_unix.a
            exit 0
          fi
          # Fallback: archive any objects produced
          OBJ=build/win32u-unix/obj
          if [ -d "$OBJ" ] && [ "$(find "$OBJ" -name '*.o' | wc -l | tr -d ' ')" -gt 0 ]; then
            find "$OBJ" -name '*.o' -print0 | xargs -0 ar rcs app/Madeira/libwin32u_unix.a
            ls -lh app/Madeira/libwin32u_unix.a
          else
            echo "win32u still missing — link may fail"
          fi

      - name: Inventory libs before xcodebuild
        run: |
          set -e
          echo "=== Required paths ==="
          for p in \
            app/Madeira/libgmp.a \
            app/Madeira/libgnutls.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libnettle.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libdxmt_combined.a \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a \
            FEX/build-ios/External/fmt/libfmt.a \
            FEX/build-ios/External/cephes/libcephes_128bit.a \
            FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a \
            FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a
          do
            if [ -f "$p" ]; then ls -lh "$p"; else echo "MISSING $p"; fi
          done

      - name: List schemes
        run: xcodebuild -project app/Madeira.xcodeproj -list

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          CONFIG="${{ github.event.inputs.configuration || 'Debug' }}"
          echo "Configuration: $CONFIG"
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath build/Madeira.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Madeira.xcarchive -name "Madeira.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Madeira.app not found in archive"
            find build/Madeira.xcarchive -type f 2>/dev/null | head -40
            exit 1
          fi
          echo "Found: $APP_PATH"
          ls -lh "$APP_PATH"
          CONFIG="${{ github.event.inputs.configuration || 'Debug' }}"
          IPA_NAME="Madeira-${CONFIG}-${{ github.run_number }}.ipa"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q "$IPA_NAME" Payload
          rm -rf Payload
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## Madeira IPA"
            echo ""
            echo "- Configuration: \`${{ github.event.inputs.configuration || 'Debug' }}\`"
            echo "- Artifact: \`${{ env.IPA_NAME || 'n/a' }}\`"
            echo "- Host libs: pulled from GameHub CI + local win32u build attempt"
            echo "- Unsigned — re-sign (Feather / AltStore) before install"
            echo ""
            ls -lh "${{ env.IPA_NAME }}" 2>/dev/null || echo "(no IPA)"
          } >> "$GITHUB_STEP_SUMMARY"
