name: Build IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ipa.yml"

jobs:
  build-ipa:
    name: Build host libs + unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Generate FEX config headers
        run: |
          set -euo pipefail
          # ConfigValues.inl + ConfigOptions.inl are cmake-generated; produce them here.
          IN=FEX/FEXCore/Source/Interface/Config/Config.json.in
          JSON=/tmp/fex-Config.json
          OUT_DIR=FEX/FEXCore/include/FEXCore/Config
          mkdir -p "$OUT_DIR" FEX/build-ios/include/FEXCore/Config

          # Strip cmake @VAR@ placeholders to usable JSON defaults
          sed -E 's/@[A-Za-z0-9_]+@/\/tmp\/fex-placeholder/g' "$IN" > "$JSON"
          python3 FEX/FEXCore/Scripts/config_generator.py \
            "$JSON" \
            "$OUT_DIR/ConfigValues.inl" \
            /tmp/fex.1 \
            "$OUT_DIR/ConfigOptions.inl"

          # Also mirror under build-ios include path (some targets use that)
          cp -v "$OUT_DIR/ConfigValues.inl" "$OUT_DIR/ConfigOptions.inl" \
            FEX/build-ios/include/FEXCore/Config/ 2>/dev/null || true
          ls -la "$OUT_DIR"
          head -5 "$OUT_DIR/ConfigValues.inl"

      - name: Fetch prebuilt host libs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prebuilt app/Madeira FEX/build-ios/FEXCore/Source
          mkdir -p FEX/build-ios/External/fmt FEX/build-ios/External/cephes
          mkdir -p FEX/build-ios/External/xxhash/cmake_unofficial FEX/build-ios/External/SoftFloat-3e

          download_artifact() {
            local owner=$1 repo=$2 run_id=$3 art_name=$4 dest=$5
            echo "Downloading $art_name from $owner/$repo run $run_id..."
            URL=$(gh api "repos/$owner/$repo/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name==\"$art_name\") | .archive_download_url" | head -1)
            if [ -z "$URL" ]; then echo "no artifact url"; return 1; fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$dest.zip" "$URL"
            unzip -o "$dest.zip" -d "$dest"
          }

          download_artifact ITZproVenom GameHub-iOS 34956261160 madeira-host-libs /tmp/prebuilt/core || true
          download_artifact ITZproVenom GameHub-iOS 36042687853 madeira-host-libs /tmp/prebuilt/dxmt || true

          for f in libntdll_unix.a libwineserver.a; do
            [ -f /tmp/prebuilt/core/$f ] && cp -v /tmp/prebuilt/core/$f app/Madeira/
          done
          [ -f /tmp/prebuilt/core/libFEXCore.a ] && cp -v /tmp/prebuilt/core/libFEXCore.a FEX/build-ios/FEXCore/Source/
          [ -f /tmp/prebuilt/core/fex/libFEXCore_Base.a ] && cp -v /tmp/prebuilt/core/fex/libFEXCore_Base.a FEX/build-ios/FEXCore/Source/
          [ -f /tmp/prebuilt/core/fex/libfmt.a ] && cp -v /tmp/prebuilt/core/fex/libfmt.a FEX/build-ios/External/fmt/
          [ -f /tmp/prebuilt/core/fex/libcephes_128bit.a ] && cp -v /tmp/prebuilt/core/fex/libcephes_128bit.a FEX/build-ios/External/cephes/
          [ -f /tmp/prebuilt/core/fex/libxxhash.a ] && cp -v /tmp/prebuilt/core/fex/libxxhash.a FEX/build-ios/External/xxhash/cmake_unofficial/
          [ -f /tmp/prebuilt/core/fex/libsoftfloat_3e.a ] && cp -v /tmp/prebuilt/core/fex/libsoftfloat_3e.a FEX/build-ios/External/SoftFloat-3e/

          if [ ! -f FEX/build-ios/FEXCore/Source/libJemallocLibs.a ]; then
            echo 'void madeira_jemalloc_stub(void){}' | xcrun -sdk iphoneos clang -arch arm64 -c -x c - -o /tmp/jemalloc_stub.o
            ar rcs FEX/build-ios/FEXCore/Source/libJemallocLibs.a /tmp/jemalloc_stub.o
          fi

          if [ -f /tmp/prebuilt/dxmt/libdxmt_combined.a ]; then
            cp -v /tmp/prebuilt/dxmt/libdxmt_combined.a app/Madeira/
          elif [ -f /tmp/prebuilt/dxmt/libdxmt_unix.a ]; then
            cp -v /tmp/prebuilt/dxmt/libdxmt_unix.a app/Madeira/libdxmt_combined.a
          fi

      - name: Provide x86_64-vcruntime folder
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          touch app/Madeira/x86_64-vcruntime/.gitkeep

      - name: Stub libwin32u if missing
        run: |
          if [ ! -s app/Madeira/libwin32u_unix.a ]; then
            echo 'void madeira_win32u_stub(void){}' | xcrun -sdk iphoneos clang -arch arm64 -c -x c - -o /tmp/win32u_stub.o
            ar rcs app/Madeira/libwin32u_unix.a /tmp/win32u_stub.o
            echo "stub libwin32u_unix.a"
          fi

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/Madeira.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Madeira.xcarchive -name "Madeira.app" -type d | head -1)
          test -n "$APP_PATH"
          IPA_NAME="Madeira-Debug-${{ github.run_number }}.ipa"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q "$IPA_NAME" Payload
          rm -rf Payload
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 14
