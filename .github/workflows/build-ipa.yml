name: Build IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ipa.yml"

jobs:
  build-ipa:
    name: Build host libs + unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Generate FEX config headers
        run: |
          set -euo pipefail
          IN=FEX/FEXCore/Source/Interface/Config/Config.json.in
          JSON=/tmp/fex-Config.json
          OUT_DIR=FEX/FEXCore/include/FEXCore/Config
          mkdir -p "$OUT_DIR" FEX/build-ios/include/FEXCore/Config
          sed -E 's/@[A-Za-z0-9_]+@/\/tmp\/fex-placeholder/g' "$IN" > "$JSON"
          python3 FEX/FEXCore/Scripts/config_generator.py \
            "$JSON" \
            "$OUT_DIR/ConfigValues.inl" \
            /tmp/fex.1 \
            "$OUT_DIR/ConfigOptions.inl"
          cp -v "$OUT_DIR/ConfigValues.inl" "$OUT_DIR/ConfigOptions.inl" \
            FEX/build-ios/include/FEXCore/Config/ 2>/dev/null || true

      - name: Fetch prebuilt host libs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prebuilt app/Madeira FEX/build-ios/FEXCore/Source
          mkdir -p FEX/build-ios/External/fmt FEX/build-ios/External/cephes
          mkdir -p FEX/build-ios/External/xxhash/cmake_unofficial FEX/build-ios/External/SoftFloat-3e

          download_artifact() {
            local owner=$1 repo=$2 run_id=$3 art_name=$4 dest=$5
            echo "Downloading $art_name from $owner/$repo run $run_id..."
            URL=$(gh api "repos/$owner/$repo/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name==\"$art_name\") | .archive_download_url" | head -1)
            if [ -z "$URL" ]; then echo "no artifact url"; return 1; fi
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$dest.zip" "$URL"
            unzip -o "$dest.zip" -d "$dest"
          }

          download_artifact ITZproVenom GameHub-iOS 34956261160 madeira-host-libs /tmp/prebuilt/core || true
          download_artifact ITZproVenom GameHub-iOS 36042687853 madeira-host-libs /tmp/prebuilt/dxmt || true

          for f in libntdll_unix.a libwineserver.a; do
            [ -f /tmp/prebuilt/core/$f ] && cp -v /tmp/prebuilt/core/$f app/Madeira/
          done
          # FEXCore from GameHub pulls LLVM — replace with stubs (see next step)
          [ -f /tmp/prebuilt/core/fex/libfmt.a ] && cp -v /tmp/prebuilt/core/fex/libfmt.a FEX/build-ios/External/fmt/
          [ -f /tmp/prebuilt/core/fex/libcephes_128bit.a ] && cp -v /tmp/prebuilt/core/fex/libcephes_128bit.a FEX/build-ios/External/cephes/
          [ -f /tmp/prebuilt/core/fex/libxxhash.a ] && cp -v /tmp/prebuilt/core/fex/libxxhash.a FEX/build-ios/External/xxhash/cmake_unofficial/
          [ -f /tmp/prebuilt/core/fex/libsoftfloat_3e.a ] && cp -v /tmp/prebuilt/core/fex/libsoftfloat_3e.a FEX/build-ios/External/SoftFloat-3e/

          if [ -f /tmp/prebuilt/dxmt/libdxmt_combined.a ]; then
            cp -v /tmp/prebuilt/dxmt/libdxmt_combined.a app/Madeira/
          elif [ -f /tmp/prebuilt/dxmt/libdxmt_unix.a ]; then
            cp -v /tmp/prebuilt/dxmt/libdxmt_unix.a app/Madeira/libdxmt_combined.a
          fi

      - name: Provide x86_64-vcruntime folder
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          touch app/Madeira/x86_64-vcruntime/.gitkeep

      - name: Build link stubs (FEX/Wine/winios without full host stack)
        run: |
          set -euo pipefail
          # Prebuilt libFEXCore needs LLVM; GameHub has no complete set either.
          # Provide minimal .a so the Xcode project links; runtime will be limited.
          cat > /tmp/madeira_link_stubs.c <<'STUBS'
          /* Wine unix lib entry tables */
          void *bcrypt_unix_call_funcs = 0;
          void *crypt32_unix_call_funcs = 0;
          void *dwrite_unix_call_funcs = 0;
          void *secur32_unix_call_funcs = 0;

          /* win32u */
          int win32u_unix_lib_init(void) { return 0; }

          /* winios driver surface */
          void winios_drv_post_key(int a, int b, int c) { (void)a;(void)b;(void)c; }
          void winios_drv_post_mouse(int a, int b, int c, int d) { (void)a;(void)b;(void)c;(void)d; }
          void winios_dump_window_tree(void) {}
          void winios_pointer(int x, int y, unsigned f, unsigned d) { (void)x;(void)y;(void)f;(void)d; }
          void winios_post_key(int a, int b) { (void)a;(void)b; }
          void winios_post_touch_down(int x, int y) { (void)x;(void)y; }
          void winios_post_touch_move(int x, int y) { (void)x;(void)y; }
          void winios_post_touch_up(int x, int y) { (void)x;(void)y; }
          void winios_set_compositor_frame(float a, float b, float c, float d) { (void)a;(void)b;(void)c;(void)d; }
          void winios_cursor_move(int x, int y) { (void)x;(void)y; }

          /* madeira host helpers referenced by UI / DXMT path */
          void madeira_capture_request(void) {}
          void madeira_d3d12_canary_run_log(void) {}
          int madeira_get_eco(void) { return 0; }
          void madeira_set_eco(int v) { (void)v; }
          void madeira_set_fence_mode(int v) { (void)v; }
          void madeira_display_set_layer(void *layer) { (void)layer; }
          void rpm_cas_snapshot_take(void) {}

          /* FEX-ish entry points sometimes required by bridges */
          void FEXCore_Init(void) {}
          void FEXCore_Shutdown(void) {}
          STUBS

          xcrun -sdk iphoneos clang -arch arm64 -c /tmp/madeira_link_stubs.c -o /tmp/madeira_link_stubs.o

          # Replace FEX static libs with stub archives (avoid LLVM dependency)
          for path in \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a \
            app/Madeira/libwin32u_unix.a
          do
            mkdir -p "$(dirname "$path")"
            ar rcs "$path" /tmp/madeira_link_stubs.o
            echo "stubbed $path"
          done

          # Ensure other small deps exist
          for path in \
            FEX/build-ios/External/fmt/libfmt.a \
            FEX/build-ios/External/cephes/libcephes_128bit.a \
            FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a \
            FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a
          do
            if [ ! -s "$path" ]; then
              mkdir -p "$(dirname "$path")"
              ar rcs "$path" /tmp/madeira_link_stubs.o
              echo "stubbed missing $path"
            fi
          done

          # Also drop stubs into app/Madeira so any -force_load path can find them
          ar rcs app/Madeira/libmadeira_link_stubs.a /tmp/madeira_link_stubs.o
          ls -lh app/Madeira/*.a FEX/build-ios/FEXCore/Source/*.a 2>/dev/null | head -40

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          # Extra -lmadeira_link_stubs if the project does not already pick it up via other .a
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/Madeira.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            OTHER_LDFLAGS="-Wl,-force_load,$(pwd)/app/Madeira/libmadeira_link_stubs.a"

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Madeira.xcarchive -name "Madeira.app" -type d | head -1)
          test -n "$APP_PATH"
          IPA_NAME="Madeira-Debug-${{ github.run_number }}.ipa"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q "$IPA_NAME" Payload
          rm -rf Payload
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 14
